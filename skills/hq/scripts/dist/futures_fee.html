<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="receipt.svg" type="image/svg+xml">
<title>期货手续费查询</title>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
  .toolbar button.active {
    background: #1890ff !important;
    color: #fff !important;
    border-color: #1890ff !important;
  }
  .ff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ff-table th, .ff-table td {
    border: 1px solid #8bb4d6;
    padding: 6px 10px;
    text-align: center;
    white-space: nowrap;
  }
  .ff-table th { background: #b3d4f0; font-weight: 600; color: #333; }
  .ff-table tbody tr:hover { background: #e6f7ff; }
  .ff-table .free-fee { background: #f6ffed; }
  .ff-table .profit { color: #f5222d; font-weight: 600; }
  .ff-table .loss { color: #52c41a; font-weight: 600; }
  .ff-table .code { font-family: "SFMono", "Consolas", monospace; color: #1890ff; }
</style>
</head>
<body class="font-sans bg-[#f0f2f5] p-4">
<div class="max-w-[1400px] mx-auto bg-white rounded-lg shadow overflow-hidden">
  <div class="toolbar px-4 py-3 border-b border-[#eee] flex gap-2 flex-wrap items-center text-sm">
    <span class="text-[#666] mr-1">交易所：</span>
    <button data-exchange="czce" class="active px-4 py-1 border border-[#d9d9d9] rounded bg-white cursor-pointer text-xs transition-all duration-200 hover:border-[#1890ff] hover:text-[#1890ff]">郑商所</button>
    <button data-exchange="dce" class="px-4 py-1 border border-[#d9d9d9] rounded bg-white cursor-pointer text-xs transition-all duration-200 hover:border-[#1890ff] hover:text-[#1890ff]">大商所</button>
    <button data-exchange="shfe" class="px-4 py-1 border border-[#d9d9d9] rounded bg-white cursor-pointer text-xs transition-all duration-200 hover:border-[#1890ff] hover:text-[#1890ff]">上期所</button>
    <button data-exchange="ine" class="px-4 py-1 border border-[#d9d9d9] rounded bg-white cursor-pointer text-xs transition-all duration-200 hover:border-[#1890ff] hover:text-[#1890ff]">上能所</button>
    <button data-exchange="cffex" class="px-4 py-1 border border-[#d9d9d9] rounded bg-white cursor-pointer text-xs transition-all duration-200 hover:border-[#1890ff] hover:text-[#1890ff]">中金所</button>
    <label class="ml-3 flex items-center gap-1 text-xs cursor-pointer select-none">
      <input type="checkbox" id="chkMain" checked>
      <span>只看主力合约</span>
    </label>
    <span class="text-[#999] text-xs ml-auto" id="updateTime"></span>
  </div>
  <div class="p-4 overflow-x-auto min-h-[200px]" id="content">
    <div class="text-center p-10 text-[#999]">加载中...</div>
  </div>
  <div class="px-4 py-2 bg-[#fafafa] border-t border-[#eee] text-xs text-[#999] text-right" id="countBar"></div>
</div>

<script>
const PROXY_PREFIX = 'https://dry-poetry-542e.email-lifeng.workers.dev/?url=';

function parseSinaTable(html) {
  const $doc = $(html);
  const timeText = $doc.text();
  const timeMatch = timeText.match(/手续费更新时间：(\d{4}-\d{2}-\d{2})/);
  const updateTime = timeMatch ? timeMatch[1] : '';
  const $table = $doc.find('table.listT');
  if ($table.length === 0) return { updateTime, rows: [] };
  const rows = [];
  $table.find('tbody tr').each(function() {
    const $cells = $(this).find('td, th');
    if ($cells.length < 10) return;
    const row = [];
    $cells.each(function() {
      row.push($(this).text().trim());
    });
    const nameMatch = row[0].match(/(.+?)\s*[\(（]\s*(\w+)\s*[\)）]/);
    if (nameMatch) {
      row[0] = nameMatch[1].trim();
      row.splice(1, 0, nameMatch[2].trim());
    }
    rows.push(row);
  });
  return { updateTime, rows };
}

function renderTable(exchange, isMain) {
  $('#content').html('<div class="text-center p-10 text-[#999]">加载中...</div>');
  $('#updateTime').text('');
  $('#countBar').text('');

  const targetUrl = 'https://vip.stock.finance.sina.com.cn/q/view/vPositions_fee.php?exchange=' + exchange + '&is_main=' + (isMain ? 1 : 0);
  $.ajax({
    url: PROXY_PREFIX + encodeURIComponent(targetUrl),
    type: 'GET',
    dataType: 'html',
    success: function(html) {
      const { updateTime, rows } = parseSinaTable(html);
      if (rows.length === 0) {
        $('#content').html('<div class="text-center p-10 text-[#f5222d]">未获取到数据</div>');
        return;
      }
      $('#updateTime').text('(手续费更新时间：' + updateTime + ')');
      $('#countBar').text('共 ' + rows.length + ' 个合约');

      var html = '<table class="ff-table">';
      html += '<thead><tr>';
      html += '<th rowspan="2">合约品种</th>';
      html += '<th colspan="3">保证金%</th>';
      html += '<th colspan="3">手续费（万分之*或*元）</th>';
      html += '<th rowspan="2">每跳毛利/元</th>';
      html += '<th rowspan="2">手续费 (开 + 平)</th>';
      html += '<th rowspan="2">每跳净利/元</th>';
      html += '</tr><tr>';
      html += '<th>买开</th><th>卖开</th><th>保证金/每手</th>';
      html += '<th>开仓</th><th>平昨</th><th>平今</th>';
      html += '</tr></thead><tbody>';

      $.each(rows, function(i, row) {
        const name = row[0], code = row[1];
        const marginPct1 = row[2], marginPct2 = row[3], marginAmt = row[4];
        const feeOpen = row[5], feeCloseYesterday = row[6], feeCloseToday = row[7];
        const tickProfit = row[8], feeTotal = row[9], tickNet = row[10];
        
        var netClass = '';
        const netVal = parseFloat(tickNet);
        if (netVal > 0) netClass = 'profit';
        else if (netVal < 0) netClass = 'loss';

        const freeClass = (feeCloseToday === '0元' || feeCloseToday.startsWith('0/')) ? ' free-fee' : '';

        html += '<tr>';
        html += '<td>' + name + '（<span class="code">' + code + '</span>）</td>';
        html += '<td>' + marginPct1 + '</td>';
        html += '<td>' + marginPct2 + '</td>';
        html += '<td>' + marginAmt + '</td>';
        html += '<td>' + feeOpen + '</td>';
        html += '<td>' + feeCloseYesterday + '</td>';
        html += '<td class="' + freeClass + '">' + feeCloseToday + '</td>';
        html += '<td>' + tickProfit + '</td>';
        html += '<td>' + feeTotal + '</td>';
        html += '<td class="' + netClass + '">' + tickNet + '</td>';
        html += '</tr>';
      });

      html += '</tbody></table>';
      $('#content').html(html);
    },
    error: function(xhr, status, error) {
      console.error('请求失败:', error);
      $('#content').html('<div class="text-center p-10 text-[#f5222d]">请求失败：' + error + '</div>');
    }
  });
}

function getCurrentExchange() {
  return $('.toolbar button.active').data('exchange');
}

$(function() {
  $('.toolbar button[data-exchange]').on('click', function() {
    $('.toolbar button[data-exchange]').removeClass('active');
    $(this).addClass('active');
    renderTable($(this).data('exchange'), $('#chkMain').is(':checked'));
  });

  $('#chkMain').on('change', function() {
    renderTable(getCurrentExchange(), $(this).is(':checked'));
  });

  renderTable('czce', true);
});
</script>
</body>
</html>
