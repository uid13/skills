<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="chart-line.svg" type="image/svg+xml">
<title>外盘期货行情</title>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
  .hf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hf-table th, .hf-table td {
    border: 1px solid #8bb4d6;
    padding: 6px 10px;
    text-align: center;
    white-space: nowrap;
  }
  .hf-table th { background: #b3d4f0; font-weight: 600; color: #333; }
  .hf-table tbody tr:hover { background: #e6f7ff; }
  .hf-table .up { color: #f5222d; font-weight: 600; }
  .hf-table .down { color: #52c41a; font-weight: 600; }
  .hf-table .name { font-weight: 600; }
</style>
</head>
<body class="font-sans bg-[#f0f2f5] p-4">
<div class="max-w-[1400px] mx-auto bg-white rounded-lg shadow overflow-hidden">
  <div class="px-4 py-3 border-b border-[#eee] flex gap-2 flex-wrap items-center text-sm">
    <span class="text-[#666] mr-1">外盘期货行情</span>
    <button id="btnRefresh" class="ml-2 px-3 py-1 border border-[#d9d9d9] rounded bg-white cursor-pointer text-xs hover:border-[#1890ff] hover:text-[#1890ff]">刷新</button>
    <span class="text-[#999] text-xs ml-auto">人民币最新汇率:<span id="usdCnyRate" class="font-semibold text-[#333]">--</span> &nbsp; 日元最新汇率:<span id="usdJpyRate" class="font-semibold text-[#333]">--</span></span>
    <span class="text-[#999] text-xs" id="updateTime"></span>
  </div>

  <div class="p-4 overflow-x-auto min-h-[200px]" id="content">
    <div class="text-center p-10 text-[#999]">加载中...</div>
  </div>
  <div class="px-4 py-2 bg-[#fafafa] border-t border-[#eee] text-xs text-[#999] text-right" id="countBar"></div>
</div>

<script>
const PROXY_PREFIX = '';

// 外盘期货品种代码列表
const SYMBOLS = [
  'FEF', 'FCPO', 'RSS3', 'RS', 'BTC', 'CT', 'NID', 'PBD', 'SND', 'ZSD',
  'AHD', 'CAD', 'S', 'W', 'C', 'BO', 'SM', 'HG', 'NG', 'CL', 'SI', 'GC',
  'LHC', 'OIL', 'XAU', 'XAG', 'XPT', 'XPD', 'EUA',
];

const SYMBOL_NAMES = {
  'FEF': '新加坡铁矿石', 'FCPO': '马棕油', 'RSS3': '日橡胶', 'RS': '美国原糖',
  'BTC': 'CME 比特币期货', 'CT': 'NYBOT-棉花', 'NID': 'LME 镍 3 个月',
  'PBD': 'LME 铅 3 个月', 'SND': 'LME 锡 3 个月', 'ZSD': 'LME 锌 3 个月',
  'AHD': 'LME 铝 3 个月', 'CAD': 'LME 铜 3 个月', 'S': 'CBOT-黄豆',
  'W': 'CBOT-小麦', 'C': 'CBOT-玉米', 'BO': 'CBOT-黄豆油', 'SM': 'CBOT-黄豆粉',
  'HG': 'COMEX 铜', 'NG': 'NYMEX 天然气', 'CL': 'NYMEX 原油', 'SI': 'COMEX 白银',
  'GC': 'COMEX 黄金', 'LHC': 'CME-瘦肉猪', 'OIL': '布伦特原油', 'XAU': '伦敦金',
  'XAG': '伦敦银', 'XPT': '伦敦铂金', 'XPD': '伦敦钯金', 'EUA': '欧洲碳排放',
};

let usdCnyRate = 0;
let usdJpyRate = 0;

// 获取汇率
function fetchRates() {
  return new Promise((resolve, reject) => {
    const targetUrl = '/hq/list=USDCNY,USDJPY';
    $.ajax({
      url: targetUrl,
      type: 'GET',
      dataType: 'text',
      success: function(data) {
        const cnyMatch = data.match(/var hq_str_USDCNY="[^"]*?,([\d.]+),/);
        if (cnyMatch) usdCnyRate = parseFloat(cnyMatch[1]);

        const jpyMatch = data.match(/var hq_str_USDJPY="[^"]*?,([\d.]+),/);
        if (jpyMatch) usdJpyRate = parseFloat(jpyMatch[1]);

        $('#usdCnyRate').text(usdCnyRate);
        $('#usdJpyRate').text(usdJpyRate);
        resolve();
      },
      error: reject
    });
  });
}

// 解析期货数据
function parseSinaData(text) {
  const rows = [];
  const lines = text.split('\n');

  for (const line of lines) {
    const match = line.match(/var hq_str_hf_(\w+)="([^"]*)"/);
    if (!match) continue;

    const symbol = match[1];
    const dataStr = match[2];
    if (!dataStr) continue;

    const fields = dataStr.split(',');
    if (fields.length < 13) continue;

    const latestPrice = parseFloat(fields[0]) || 0;
    const bidPrice = fields[2] || '';
    const askPrice = fields[3] || '';
    const highPrice = fields[4] || '';
    const lowPrice = fields[5] || '';
    const quoteTime = fields[6] || '';
    const prevSettle = parseFloat(fields[7]) || 0;
    const openPrice = fields[8] || '';
    const openInterest = fields[9] || '';
    const bidVol = fields[10] || '';
    const askVol = fields[11] || '';
    const quoteDate = fields[12] || '';
    const name = SYMBOL_NAMES[symbol] || fields[13] || symbol;

    // 计算涨跌
    const changeAmount = latestPrice - prevSettle;
    const changePercent = prevSettle !== 0 ? (changeAmount / prevSettle * 100) : 0;

    rows.push({
      name, symbol, latestPrice,
      changeAmount: changeAmount.toFixed(3),
      changePercent: changePercent.toFixed(2) + '%',
      openPrice, highPrice, lowPrice, prevSettle: prevSettle.toFixed(3),
      openInterest, bidPrice, askPrice, quoteTime: quoteDate + ' ' + quoteTime
    });
  }

  return rows;
}

function renderTable(rows) {
  if (rows.length === 0) {
    $('#content').html('<div class="text-center p-10 text-[#f5222d]">未获取到数据</div>');
    $('#countBar').text('');
    return;
  }

  $('#countBar').text('共 ' + rows.length + ' 个品种');
  $('#updateTime').text('更新时间：' + new Date().toLocaleTimeString('zh-CN'));

  var html_output = '<table class="hf-table">';
  html_output += '<thead><tr>';
  html_output += '<th>名称</th><th>最新价</th><th>涨跌额</th><th>涨跌幅</th>';
  html_output += '<th>开盘价</th><th>最高价</th><th>最低价</th><th>昨日结算价</th>';
  html_output += '<th>持仓量</th><th>买价</th><th>卖价</th><th>行情时间</th>';
  html_output += '</tr></thead><tbody>';

  $.each(rows, function(i, row) {
    var priceClass = '';
    if (row.changePercent.startsWith('+') || (!row.changePercent.startsWith('-') && row.changePercent !== '0.00%')) {
      priceClass = 'up';
    } else if (row.changePercent.startsWith('-')) {
      priceClass = 'down';
    }

    html_output += '<tr>';
    html_output += '<td class="name">' + row.name + '</td>';
    html_output += '<td class="' + priceClass + '">' + row.latestPrice + '</td>';
    html_output += '<td class="' + priceClass + '">' + row.changeAmount + '</td>';
    html_output += '<td class="' + priceClass + '">' + row.changePercent + '</td>';
    html_output += '<td>' + row.openPrice + '</td>';
    html_output += '<td>' + row.highPrice + '</td>';
    html_output += '<td>' + row.lowPrice + '</td>';
    html_output += '<td>' + row.prevSettle + '</td>';
    html_output += '<td>' + row.openInterest + '</td>';
    html_output += '<td>' + row.bidPrice + '</td>';
    html_output += '<td>' + row.askPrice + '</td>';
    html_output += '<td>' + row.quoteTime + '</td>';
    html_output += '</tr>';
  });

  html_output += '</tbody></table>';
  $('#content').html(html_output);
}

function loadData() {
  $('#content').html('<div class="text-center p-10 text-[#999]">加载中...</div>');
  $('#updateTime').text('');
  $('#countBar').text('');
  $('#usdCnyRate').text('--');
  $('#usdJpyRate').text('--');

  fetchRates().then(function() {
    const symbolList = SYMBOLS.map(s => 'hf_' + s).join(',');
    const targetUrl = '/hq/list=' + symbolList;

    $.ajax({
      url: targetUrl,
      type: 'GET',
      dataType: 'text',
      success: function(data) {
        const rows = parseSinaData(data);
        renderTable(rows);
      },
      error: function(xhr, status, error) {
        console.error('请求失败:', error);
        $('#content').html('<div class="text-center p-10 text-[#f5222d]">请求失败：' + error + '</div>');
      }
    });
  }).catch(function() {
    $('#usdCnyRate').text('获取失败');
    $('#usdJpyRate').text('获取失败');

    const symbolList = SYMBOLS.map(s => 'hf_' + s).join(',');
    const targetUrl = '/hq/list=' + symbolList;

    $.ajax({
      url: targetUrl,
      type: 'GET',
      dataType: 'text',
      success: function(data) {
        const rows = parseSinaData(data);
        renderTable(rows);
      },
      error: function(xhr, status, error) {
        $('#content').html('<div class="text-center p-10 text-[#f5222d]">请求失败：' + error + '</div>');
      }
    });
  });
}

$(function() {
  $('#btnRefresh').on('click', loadData);
  loadData();
});
</script>
</body>
</html>
