<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="chart-line.svg" type="image/svg+xml">
<title>自编指标</title>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<style>
  .indicator-fieldset { border: 1px solid #d9d9d9; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #fafafa; }
  .indicator-fieldset legend { font-weight: 600; padding: 0 8px; }
  .indicator-img { max-width: 100%; height: auto; border-radius: 4px; }
</style>
</head>
<body class="font-sans bg-[#f0f2f5] p-4">
<div class="max-w-[1200px] mx-auto">

<fieldset class="indicator-fieldset">
  <legend class="text-[#1890ff]">收费指标，感兴趣，请联系</legend>
  <div class="text-left mt-2">
    <img src="assets/wechat.png" class="indicator-img w-[98px] h-[98px]" alt="微信二维码">
  </div>
</fieldset>

<fieldset class="indicator-fieldset">
  <legend class="text-[#f5222d]">蓝思科技</legend>
  <div class="text-center mt-2">
    <img src="assets/300433.png" class="indicator-img" alt="蓝思科技指标">
  </div>
</fieldset>

<fieldset class="indicator-fieldset">
  <legend class="text-[#f5222d]">沪镍2607</legend>
  <div class="text-center mt-2">
    <img src="assets/ni2607.png" class="indicator-img" alt="沪镍2607指标">
  </div>
</fieldset>

</div>
</body>
</html>
